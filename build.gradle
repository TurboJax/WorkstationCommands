import org.spongepowered.gradle.plugin.config.PluginLoaders;
import org.spongepowered.plugin.metadata.model.PluginDependency;

plugins {
    id 'java-library'
    id "org.spongepowered.gradle.plugin" version "2.3.1-SNAPSHOT"
}

group = 'org.turbojax'
version = '2.0.1'

repositories {
    mavenCentral()
}

sponge {
    apiVersion "17.0.0"
    minecraftVersion "1.21.10"
    license "GPLv3"
    loader {
        name PluginLoaders.JAVA_PLAIN
        version "1.0"
    }
    plugin("workstationcommands") {
        displayName "WorkstationCommands"
        entrypoint "org.turbojax.workstationCommands.WorkstationCommands"
        description "Adds commands for every workstation"
        links {
            source "https://github.com/TurboJax/WorkstationCommands/tree/sponge"
        }
        contributor("TurboJax")  {
            description "Developer"
        }
        dependency("spongeapi") {
            loadOrder PluginDependency.LoadOrder.AFTER
            optional false
        }
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}
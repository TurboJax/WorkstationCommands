  aliases:
    - "smelt"

wcblastfurnace:
  enabled: true
  aliases:
    - "blast"

wcsmoker:
  enabled: true
  aliases:
    - "smoke"

wcsmithing:
  enabled: true
  aliases:
    - "smith"

wcanvil:
  enabled: true

wcenchant:
  enabled: true
  aliases:
    - "enchanting"

wcgrindstone:
  enabled: true
  aliases:
    - "grind"

wcbrew:
  enabled: true
  aliases:
    - "brew"